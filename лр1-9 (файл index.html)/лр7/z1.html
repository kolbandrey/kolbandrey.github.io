<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>лр7</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f4; }

        /* ========== ШАПКА ========== */
        header {
            grid-column: 1 / -1;
            background: #fff;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            z-index: 100;
        }

        .logo { font-weight: bold; font-size: 18px; color: #333; text-decoration: none; }

        /* Навигация (десктоп) */
        .main-nav ul {
            list-style: none;
            display: flex;
            margin: 0; padding: 0;
            gap: 20px;
        }

        .main-nav a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .main-nav a:hover { background: #eee; }

        /* Кнопка бургера */
        .burger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            width: 30px;
            height: 20px;
            position: relative;
        }

        .burger span {
            display: block;
            width: 100%;
            height: 3px;
            background: #333;
            border-radius: 2px;
            position: absolute;
            left: 0;
            transition: all 0.3s ease;
        }
        .burger span:nth-child(1) { top: 0; }
        .burger span:nth-child(2) { top: 9px; }
        .burger span:nth-child(3) { top: 18px; }

        /* Состояние бургера при открытии */
        .burger.active span:nth-child(1) { transform: rotate(45deg); top: 9px; }
        .burger.active span:nth-child(2) { opacity: 0; }
        .burger.active span:nth-child(3) { transform: rotate(-45deg); top: 9px; }

        /* ========== СЕТКА ========== */
        .container {
            display: grid;
            gap: 10px;
            grid-template-columns: 1fr 2fr 1fr;
            padding: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .box {
            background: #005ee2;
            color: white;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 24px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .b4 { grid-row: span 3; }
        .b6 { grid-row: span 2; }

        footer {
            grid-column: 1 / -1;
            background: #333;
            color: #fff;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }

        /* ========== ПЛАНШЕТ (до 768px) ========== */
        @media (max-width: 768px) {
            /* Показываем бургер */
            .burger { display: block; }

            /* Скрываем обычное меню */
            .main-nav {
                display: none; /* JS будет переключать это */
                position: absolute;
                top: 60px;
                left: 0;
                width: 100%;
                background: #fff;
                box-shadow: 0 5px 10px rgba(0,0,0,0.1);
                padding-bottom: 10px;
            }
            
            .main-nav.open { display: block; }

            .main-nav ul {
                flex-direction: column;
                gap: 0;
            }

            .main-nav a {
                display: block;
                padding: 15px 20px;
                border-bottom: 1px solid #eee;
            }

            /* Сетка планшета */
            .container { grid-template-columns: 1fr 1fr; }
            .b4 { grid-row: span 2; }
            .b5 { grid-column: 1; }
            .b6 { grid-column: 2; }
        }

        /* ========== МОБИЛЬНЫЙ (до 480px) ========== */
        @media (max-width: 480px) {
            .container {
                grid-template-columns: 1fr; /* Одна колонка */
                padding: 8px;
                gap: 8px;
            }

            /* Сбрасываем span, чтобы блоки шли друг за другом */
            .b4, .b6 {
                grid-row: auto;
                grid-column: auto;
            }

            .box {
                padding: 30px 20px; /* Выше блоки */
                min-height: 80px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="container" style="display: contents;"> 
        <!-- Используем display: contents на контейнере, чтобы header/footer были частью грида, но навигация вне потока грида не ломалась -->
        <!-- Лучше вынести header из grid-контейнера для упрощения layout шапки -->
    </div>

    <header>
        <a href="#" class="logo">ЛР 7</a>
        <nav class="main-nav" id="mainNav">
            <ul>
                <li><a href="#">Главная</a></li>
                <li><a href="#b1">Блок 1</a></li>
                <li><a href="#b2">Блок 2</a></li>
                <li><a href="#b3">Блок 3</a></li>
            </ul>
        </nav>
        <button class="burger" id="burgerBtn" aria-label="Меню">
            <span></span><span></span><span></span>
        </button>
    </header>

    <div class="container">
        <div class="box b1">1</div>
        <div class="box b4">4</div>
        <div class="box b5">5</div>
        <div class="box b2">2</div>
        <div class="box b6">6</div>
        <div class="box b3">3</div>
        <footer>ПОДВАЛ</footer>
    </div>

    <script>
        const burger = document.getElementById('burgerBtn');
        const nav = document.getElementById('mainNav');

        // Открытие/закрытие меню
        burger.addEventListener('click', () => {
            nav.classList.toggle('open');
            burger.classList.toggle('active');
        });

        // Закрытие меню при клике на ссылку
        nav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                nav.classList.remove('open');
                burger.classList.remove('active');
            });
        });
    </script>
</body>
</html>
